<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN Board MCQ Test</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-roboto antialiased">
    <div id="app-container" class="container mx-auto p-4 max-w-3xl">
        <header class="text-center py-8 relative">
            <h1 class="text-3xl sm:text-4xl font-semibold text-blue-600 dark:text-sky-400">TN Board MCQ Test</h1>
            <button id="dark-mode-toggle" aria-label="Toggle Dark Mode" class="absolute top-4 right-0 sm:right-4 p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            </button>
        </header>

        <main id="home-page" class="mt-6 bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-xl shadow-lg">
            <h2 class="text-xl sm:text-2xl font-medium mb-6 text-center text-gray-700 dark:text-gray-200">Start a Test</h2>

            <div class="space-y-5">
                <div>
                    <label for="standard-select" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Standard</label>
                    <select id="standard-select" name="standard" class="mt-1 block w-full py-2.5 px-3 border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-gray-100 rounded-md shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <option value="">Select Standard</option>
                        <option value="+1">+1 (Class 11)</option>
                        <option value="+2">+2 (Class 12)</option>
                    </select>
                </div>

                <div>
                    <label for="subject-select" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Subject</label>
                    <select id="subject-select" name="subject" class="mt-1 block w-full py-2.5 px-3 border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-gray-100 rounded-md shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" disabled>
                        <option value="">Select Subject</option>
                    </select>
                </div>

                <div>
                    <label for="lesson-select" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Lesson</label>
                    <select id="lesson-select" name="lesson" class="mt-1 block w-full py-2.5 px-3 border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-gray-100 rounded-md shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" disabled>
                        <option value="">Select Lesson</option>
                        <option value="mixed">All Lessons (Mixed Questions)</option>
                    </select>
                </div>
            </div>

            <div class="mt-8 text-center">
                <button id="start-quiz-btn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 dark:bg-sky-500 dark:hover:bg-sky-600 text-white font-medium py-2.5 px-10 rounded-md shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-slate-800 transition-all duration-200 ease-in-out text-base" disabled>
                    Start Test
                </button>
            </div>
        </main>

        <footer class="text-center mt-12 py-4">
            {/* Footer content removed as per previous request */}
        </footer>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
