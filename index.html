<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN Board MCQ Challenge</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4">
        <header class="text-center py-6 relative">
            <h1 class="text-4xl sm:text-5xl font-bold text-blue-600 dark:text-blue-400">TN Board MCQ Test</h1>
            <button id="dark-mode-toggle" aria-label="Toggle Dark Mode" class="absolute top-2 right-2 sm:top-4 sm:right-4 p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            </button>
        </header>

        <main id="home-page" class="mt-10 bg-white dark:bg-gray-800 p-6 sm:p-8 rounded-xl shadow-2xl max-w-lg mx-auto">
            <h2 class="text-2xl sm:text-3xl font-semibold mb-8 text-center text-gray-700 dark:text-gray-200">Start a Test</h2>

            <div class="mb-5">
                <label for="standard-select" class="block text-md font-medium text-gray-700 dark:text-gray-300 mb-1.5">Standard:</label>
                <select id="standard-select" name="standard" class="mt-1 block w-full py-2.5 px-3.5 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 focus:border-indigo-500 dark:focus:border-indigo-400 sm:text-md">
                    <option value="">Select Standard</option>
                    <option value="+1">+1 (Class 11)</option>
                    <option value="+2">+2 (Class 12)</option>
                </select>
            </div>

            <div class="mb-5">
                <label for="subject-select" class="block text-md font-medium text-gray-700 dark:text-gray-300 mb-1.5">Subject:</label>
                <select id="subject-select" name="subject" class="mt-1 block w-full py-2.5 px-3.5 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 focus:border-indigo-500 dark:focus:border-indigo-400 sm:text-md" disabled>
                    <option value="">Select Subject</option>
                    {/* Options will be populated by JS */}
                </select>
            </div>

            <div class="mb-8">
                <label for="lesson-select" class="block text-md font-medium text-gray-700 dark:text-gray-300 mb-1.5">Lesson:</label>
                <select id="lesson-select" name="lesson" class="mt-1 block w-full py-2.5 px-3.5 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 focus:border-indigo-500 dark:focus:border-indigo-400 sm:text-md" disabled>
                    <option value="">Select Lesson (or All Lessons)</option>
                    <option value="mixed">All Lessons (Mixed Questions)</option>
                    {/* Options will be populated by JS */}
                </select>
            </div>

            <button id="start-quiz-btn" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-semibold py-3.5 px-4 rounded-lg shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 transition-all duration-150 ease-in-out text-lg" disabled>
                Let's Go!
            </button>
        </main>

        <footer class="text-center mt-16 py-6">
            {/* Footer content removed as per request */}
        </footer>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
