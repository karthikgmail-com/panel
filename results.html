<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Results - TN Board MCQ</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-roboto antialiased">
    <div id="app-container" class="container mx-auto p-4 flex flex-col items-center justify-center min-h-screen">
        <canvas id="confetti-canvas" class="fixed top-0 left-0 w-full h-full pointer-events-none z-[1000]"></canvas>

        <div id="results-card" class="bg-white dark:bg-slate-800 p-6 sm:p-10 rounded-xl shadow-xl w-full max-w-2xl text-center opacity-0 transform translate-y-8">
            <header class="mb-6 sm:mb-8">
                <h1 class="text-2xl sm:text-3xl font-semibold text-blue-600 dark:text-sky-400">Test Results</h1>
            </header>

            <section id="score-summary" class="mb-8">
                <div class="mb-3">
                    <p class="text-4xl sm:text-5xl font-bold text-green-500 dark:text-green-400 my-1">
                        <span id="correct-answers">0</span>/<span id="total-questions">0</span>
                    </p>
                    <p id="percentage-display" class="text-xl sm:text-2xl text-green-500 dark:text-green-400 font-medium">0%</p>
                </div>
                <p id="result-message" class="text-lg sm:text-xl text-gray-700 dark:text-gray-200 mt-2">Well done!</p>
            </section>

            <section id="detailed-review" class="mb-8 text-left">
                <h2 class="text-lg sm:text-xl font-medium text-gray-700 dark:text-gray-200 mb-4 border-b border-gray-200 dark:border-slate-700 pb-2">Review Incorrect Answers:</h2>
                <div id="incorrect-answers-container" class="space-y-5 max-h-80 overflow-y-auto p-1 custom-scrollbar">
                     <p id="no-incorrect-answers" class="text-gray-600 dark:text-gray-300 text-center py-3">Congratulations! No incorrect answers to review.</p>
                </div>
            </section>

            <section id="actions" class="mt-8 flex flex-col sm:flex-row justify-center gap-3 sm:gap-4">
                <button id="retake-quiz-btn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 dark:bg-sky-500 dark:hover:bg-sky-600 text-white font-medium py-2.5 px-6 rounded-md shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-slate-800 transition-all duration-200 ease-in-out">
                    Retake Test
                </button>
                <button id="return-home-btn" class="w-full sm:w-auto bg-gray-500 hover:bg-gray-600 dark:bg-slate-600 dark:hover:bg-slate-700 text-white font-medium py-2.5 px-6 rounded-md shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 dark:focus:ring-offset-slate-800 transition-all duration-200 ease-in-out">
                    Return to Home
                </button>
            </section>
        </div>

        <footer class="text-center mt-12 py-4 sm:absolute sm:bottom-0 sm:left-0 sm:right-0">
            {/* Footer content removed */}
        </footer>
    </div>
    <script src="js/results.js"></script>
</body>
</html>
