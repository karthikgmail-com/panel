<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Test - TN Board</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-roboto antialiased">
    <div id="app-container" class="container mx-auto p-4 max-w-3xl">
        <header class="sticky top-0 bg-white dark:bg-slate-800 shadow-md z-10 p-3 sm:p-4 rounded-b-lg mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-xl sm:text-2xl font-medium text-blue-600 dark:text-sky-400">TN Board MCQ Test</h1>
                    <p id="quiz-title" class="text-xs sm:text-sm text-gray-500 dark:text-gray-400">Subject: <span id="subject-name" class="font-medium"></span> | Lesson: <span id="lesson-name" class="font-medium"></span></p>
                </div>
                <div class="text-right">
                    <div id="timer" class="text-lg sm:text-xl font-medium text-red-500 dark:text-red-400">Time: <span id="time-left">00:00</span></div>
                    <div id="progress-indicator" class="text-xs sm:text-sm text-gray-600 dark:text-gray-300 mt-0.5"><span id="total-questions-num">0</span> Questions</div>
                </div>
            </div>
        </header>

        <main id="quiz-area" class="bg-white dark:bg-slate-800 p-0 sm:p-2 rounded-lg">
            <div id="loading-indicator" class="text-center py-10">
                <p class="text-lg text-gray-600 dark:text-gray-300">Loading Test...</p>
                {/* Optional: Spinner */}
            </div>
            <div id="questions-container" class="space-y-6" style="display: none;">
                {/* Questions will be loaded here */}
            </div>

            <div class="mt-8 mb-4 text-center">
                <button id="submit-quiz-btn" style="display: none;" class="bg-green-500 hover:bg-green-600 dark:bg-green-600 dark:hover:bg-green-700 text-white font-medium py-2.5 px-10 rounded-md shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 dark:focus:ring-offset-slate-800 transition-all duration-200 ease-in-out text-base">
                    Submit Test
                </button>
            </div>
        </main>

        <footer class="text-center mt-12 py-4">
            {/* Footer content removed */}
        </footer>
    </div>
    <script src="js/quiz.js"></script>
</body>
</html>
