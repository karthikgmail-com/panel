<body class="bg-gray-100 text-gray-800">

                </div>
                <div class="text-right">
                    <div id="timer" class="text-xl font-semibold text-red-500">Time Left: <span id="time-left">00:00</span></div>
                    <div id="progress-indicator" class="text-sm text-gray-600 mt-1">Question <span id="current-question-num">0</span> of <span id="total-questions-num">0</span></div>
                </div>
            </div>
        </header>

        <main id="quiz-area" class="mt-8 max-w-4xl mx-auto bg-white dark:bg-gray-800 p-6 sm:p-8 rounded-lg shadow-xl">
            <div id="loading-indicator" class="text-center py-10">
                <p class="text-xl text-gray-600 dark:text-gray-300">Loading Quiz...</p>
                <!-- Optional: Add a spinner SVG or animation here -->
